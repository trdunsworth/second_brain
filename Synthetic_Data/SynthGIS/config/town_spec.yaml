# SynthGIS Town Specification
# Copy this file and customize for your synthetic town

metadata:
  name: "Synthville"
  state: "SY"                    # Fictional USPS state code
  county: "Synthetic County"
  municipality: "Synthville"
  nguid_domain: "synthgis.local" # NENA NGUID domain (must be fictional)
  disclaimer: "SYNTHETIC DATA - NOT FOR OPERATIONAL USE"
  license: "CC-BY-4.0"
  # generation_date: auto-filled

crs:
  projected: "EPSG:2263"         # NAD83 / New York Long Island (ftUS) — example
  geographic: "EPSG:4326"        # WGS84 for export

extent:
  # Bounding box in projected CRS (feet for EPSG:2263)
  # ~4.5km x 3.6km ≈ 16 km² (small town)
  minx: 900000
  maxx: 1050000
  miny: 180000
  maxy: 300000

seed: 42  # Master seed for reproducibility (null = random)

street_hierarchy:
  arterial:
    target_length_km: 15
    spacing_m: 800
    road_class: "SH"             # State highway
    speed_mph: 45
    lanes: 2
    divided: false
  collector:
    target_length_km: 30
    spacing_m: 300
    road_class: "CO"             # County road
    speed_mph: 35
    lanes: 2
    divided: false
  local:
    target_length_km: 80
    spacing_m: 100
    road_class: "LO"             # Local road
    speed_mph: 25
    lanes: 2
    divided: false
  cul_de_sac:
    max_length_m: 150
    road_class: "LO"
    speed_mph: 15

zoning:
  residential:
    proportion: 0.65
    min_parcel_sqm: 400
    max_parcel_sqm: 2000
    setback_m: 6
    building_coverage: 0.35
    floors: [1, 2]
  commercial:
    proportion: 0.20
    min_parcel_sqm: 1000
    max_parcel_sqm: 10000
    setback_m: 10
    building_coverage: 0.50
    floors: [1, 3]
  industrial:
    proportion: 0.10
    min_parcel_sqm: 5000
    max_parcel_sqm: 50000
    setback_m: 15
    building_coverage: 0.60
    floors: [1, 2]
  civic:
    proportion: 0.05
    min_parcel_sqm: 2000
    max_parcel_sqm: 20000
    setback_m: 10
    building_coverage: 0.40
    floors: [1, 3]

hydrology:
  enabled: true
  stream_count: 1
  min_width_m: 10
  max_width_m: 50

addressing:
  scheme: "grid_quadrant"        # or "mile_marker", "sequential"
  quadrant_origin: "center"      # SW/NE/etc.
  base_interval: 100             # Addresses per block face
  parity: "even_odd"             # Standard US

operational:
  psap_count: 1
  fire_stations: 2
  police_stations: 1
  ems_stations: 2
  hospitals: 1
  response_zones_per_service: 4

output:
  geopackage: "output/synthetic_town.gpkg"
  postgis_dump: "output/synthetic_town.sql"
  include_metadata_layer: true